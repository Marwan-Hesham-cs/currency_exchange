<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: cursive;">
<div class="main-project">

    <!-- Navbar -->
    <nav class="navbar bg-black px-4 py-2 d-flex justify-content-around align-items-center mb-5">
        <span class="navbar-brand p-0 m-0">
            <img src="https://exchanger-nine.vercel.app/images/nav-banner.png" alt="Currency Logo" style="height: 55px; border-radius: 4px;">
        </span>
        <h2 class="text-warning fw-bold m-0 fs-3">Currency-Converter</h2>
    </nav>

    <!-- Main card -->
    <div class="main-card col-11 col-md-9 col-lg-8 mx-auto pt-3 px-4 pb-4 px-md-5 pb-md-5 rounded-4 shadow-lg text-center">
        
        <!-- User Input + Switch Button -->
        <div class="input_components mt-3 mb-4 pb-2 border-bottom border-primary border-2">
            <div class="text-start amount mb-1">
                <h3 class="px-2 m-0 text-secondary fs-5" style="user-select: none;">Amount</h3>
            </div>
            <div class="input d-flex justify-content-between align-items-center px-2">
       
                <input id="user_input" placeholder="1 By default" class="text-primary fw-bold fs-5 w-100 bg-transparent border-0" type="text" style="outline: none;">
                <i id="swap_button" class="fa-solid fa-arrow-right-arrow-left arrow-logo text-end fw-bold fs-3 ms-2" style="color: #0466e7; cursor: pointer;"></i>
            </div>
        </div>

        <!-- Selection Area -->
        <div class="selection w-75 mx-auto mb-4">
            
            <!-- From Select Box -->
            <div class="d-flex align-items-center bg-black border border-secondary p-2 px-3 rounded-2 mb-3">
                <img id="from_flag" src="" alt="flag" style="width: 28px; height: 20px; object-fit: cover;">
                <select class="bg-black text-white w-100 ms-2 border-0 fs-6" name="from_curr" id="from_curr" style="outline: none; cursor: pointer;"></select>
            </div>

            <!-- To Select Box -->
            <div class="d-flex align-items-center bg-black border border-secondary p-2 px-3 rounded-2 mb-3">
                <img id="to_flag" src="" alt="flag" style="width: 28px; height: 20px; object-fit: cover;">
                <select class="bg-black text-white w-100 ms-2 border-0 fs-6" name="to_curr" id="to_curr" style="outline: none; cursor: pointer;"></select>
            </div>

        </div>

        <!-- Convert Button -->
        <div class="convertion_btn mb-4">
            <button id="convertBtn" class="btn btn-dark w-75 py-2 fs-5 border border-secondary">Convert</button>
        </div>

        <!-- Display Area -->
        <div class="display_box mb-2"></div>

    </div>
</div>

<!-- Countries should load first so Script.js can use it!! -->
<script src="countries.js"></script>
<script src="script.js"></script> 
</body>
</html>
