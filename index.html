<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="font-family: cursive;">
<div class="main-project">

    <!-- Navbar -->
    <nav class="navbar bg-black px-4 py-2 d-flex justify-content-around align-items-center mb-5">
        <span class="navbar-brand p-0 m-0" href="#">
            <img src="https://exchanger-nine.vercel.app/images/nav-banner.png" alt="Currency Logo" style="height: 55px; border-radius: 4px;">
        </span>
        <h2 class="text-warning fw-bold m-0 fs-4">Currency-Converter</h2>
    </nav>

         <!-- Main card  -->
   <div class="main-card text-center justify-content-center w-50 m-auto row h-50 rounded-4">
       
    <!-- User Input + Switch Button -->
     <div class="input_components mb-3">
        <div class="text-start amount">
            <h3 class="px-4 pt-3" style="user-select: none;">Amount</h3>
        </div>
        <div class="input justify-content-between d-flex px-5 align-items-center">
            <input id="user_input" placeholder="1 By default" class="text-primary fw-bold fs-6 w-100" type="text">
            <i id="swap_button" class="fa-solid fa-arrow-right-arrow-left arrow-logo text-end fw-bold fs-3" style="color: #0466e7"></i>
        </div>
    </div>
        <!-- Selection Area -->
         <div class="selection">
        <div class="select_from mb-3">
            <img id="from_flag" src="" alt="select_country!">
            <select class="bg-black text-white w-75 p-1 px-5 rounded-3" name="from_curr" id="from_curr" style="border: none;"></select>
        </div>

        <div class="select_to mb-3">
             <img id="to_flag" src="" alt="select_country!">
            <select class="bg-black text-white w-75 p-1 px-5 rounded-3" name="to_curr" id="to_curr"  style="border: none;"></select>
        </div>
         </div>

            <!-- Convert Button -->
        <div class="convertion_btn">
        <button id="convertBtn" class="btn btn-dark mb-4 w-75">Convert</button>
    </div>

    <!-- Display Area -->
    <div class="display_box mb-4">
        
    </div>
    
   </div>
</div>

<!-- countries should load before script so script can use it! -->
<script src="countries.js"></script>
<script src="script.js"></script>   
</body>
</html>
