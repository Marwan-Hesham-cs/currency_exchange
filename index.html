<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar bg-black px-4 py-2 d-flex justify-content-between align-items-center">
        <a class="navbar-brand p-0 m-0" href="#">
            <img src="https://exchanger-nine.vercel.app/images/nav-banner.png" alt="Currency Logo" style="height: 55px; border-radius: 4px;">
        </a>
        <h2 class="text-warning fw-bold m-0 fs-4">Currency-Converter</h2>
    </nav>

    <!-- Main Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <!-- Main Card -->
                <div class="main-card p-4 p-md-5 rounded-4 shadow-lg text-white">
                    
                    <!-- Amount & Switch Icon Header -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h3 class="m-0 text-secondary fw-semibold">Amount</h3>
                        <i class="fa-solid fa-right-left text-info fs-4" style="cursor: pointer;"></i>
                    </div>

                    <!-- Input Field -->
                    <div class="mb-4">
                        <input type="text" placeholder="1 By Default" class="form-control bg-transparent text-secondary border-0 border-bottom border-primary rounded-0 shadow-none fs-5 px-0" value="1">
                    </div>

                    <!-- Currency Selectors -->
                    <div class="currency-selectors mb-4">
                        <select class="form-select bg-black text-white border-0 py-2 mb-3">
                            <option selected>🇦🇪 AED || United Arab Emirates Dirham</option>
                        </select>
                        
                        <select class="form-select bg-black text-white border-0 py-2 mb-3">
                            <option selected>🇪🇬 EGP || Egyptian Pound</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2 fw-bold text-light border-0">Convert</button>

                    <!-- Display -->
                    <div class="display text-center text-white fs-2 fw-bold mt-4">
                        1 AED = 14.24 EGP
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="currency-exchange-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
